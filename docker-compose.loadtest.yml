services:
  postgres:
    image: postgres:17.6
    container_name: moodila-postgres-loadtest
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: loadtest-only
      POSTGRES_DB: moodila_loadtest
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - loadtest-postgres:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track_planning=on", "-c", "max_parallel_workers_per_gather=0"]
    cpuset: "${CPUSET:-0}"
    mem_limit: "${DB_MEM:-512m}"
    memswap_limit: "${DB_MEM:-512m}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moodila_loadtest"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moodila-api-loadtest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://postgres:loadtest-only@postgres:5432/moodila_loadtest?sslmode=disable
      JWT_SECRET: isolated-loadtest-secret-never-use-in-production
      APP_ENV: development
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      ENABLE_AUTO_BACKUP: "false"
      DISABLE_RATE_LIMIT: "${DISABLE_RATE_LIMIT:-false}"
      GOMAXPROCS: "${GOMAXPROCS:-1}"
    cpuset: "${CPUSET:-0}"
    mem_limit: "${API_MEM:-512m}"
    memswap_limit: "${API_MEM:-512m}"

volumes:
  loadtest-postgres:
    name: moodila-loadtest-postgres-v2
