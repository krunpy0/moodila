name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      #################################################
      # Frontend
      #################################################

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      #################################################
      # Backend
      #################################################

      - name: Download Go modules
        working-directory: backend
        run: go mod download

      - name: Build backend
        working-directory: backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build \
          -ldflags="-s -w" \
          -o moodila \
          ./cmd/api

      #################################################
      # Archive frontend
      #################################################

      - name: Pack frontend
        run: |
          tar -czf frontend.tar.gz -C frontend/dist .

      #################################################
      # SSH
      #################################################

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          echo "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      #################################################
      # Upload
      #################################################

      - name: Upload backend
        run: |
          scp -P "${{ secrets.PORT || 22 }}" \
          backend/moodila \
          ${{ secrets.USER }}@${{ secrets.HOST }}:/opt/moodila/incoming/

      - name: Upload frontend
        run: |
          scp -P "${{ secrets.PORT || 22 }}" \
          frontend.tar.gz \
          ${{ secrets.USER }}@${{ secrets.HOST }}:/opt/moodila/incoming/

      #################################################
      # Deploy
      #################################################

      - name: Deploy
        run: |
          ssh \
          scp -P "${{ secrets.PORT || 22 }}" \
          ${{ secrets.USER }}@${{ secrets.HOST }} \
          "/opt/moodila/deploy.sh"
