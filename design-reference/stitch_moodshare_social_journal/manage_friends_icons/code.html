<script>
        // Micro-interactions for button presses
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                if (this.innerText.includes('+ Add')) {
                    const originalText = this.innerText;
                    this.innerText = 'Sent';
                    this.classList.remove('bg-primary-container', 'text-primary');
                    this.classList.add('bg-secondary-container', 'text-on-secondary-container');
                    this.disabled = true;
                    
                    // Simple "Undo" logic simulation
                    setTimeout(() => {
                        this.innerText = originalText;
                        this.classList.add('bg-primary-container', 'text-primary');
                        this.classList.remove('bg-secondary-container', 'text-on-secondary-container');
                        this.disabled = false;
                    }, 3000);
                }
            });
        });
