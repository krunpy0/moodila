<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Moodila" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
    <title>Moodila</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('moodshare_theme');
          var isDark = false;
          if (t) {
            if (t === 'dark' || t.endsWith('-dark')) {
              isDark = true;
            }
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            t = 'dark';
            isDark = true;
          } else {
            t = 'light';
          }
          var root = document.documentElement;
          root.setAttribute('data-theme', t);
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          var themeMetaColors = {
            'light': '#F8F7F5',
            'dark': '#171615',
            'halloween-light': '#F8F3EB',
            'halloween-dark': '#131016',
            'forest-light': '#F3F6F2',
            'forest-dark': '#111813',
            'ocean-light': '#F1F5F8',
            'ocean-dark': '#0E161C',
            'lavender-light': '#F6F3F8',
            'lavender-dark': '#18121D',
            'terracotta-light': '#F9F5F0',
            'terracotta-dark': '#1A1310',
            'aurora-light': '#F1F7F6',
            'aurora-dark': '#0C1414'
          };
          var metaColor = themeMetaColors[t] || (isDark ? '#171615' : '#F8F7F5');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', metaColor);
          }
          var activeThemesStored = localStorage.getItem('moodshare_active_seasonal_themes');
          var isHalloweenAvailable = activeThemesStored
            ? activeThemesStored.indexOf('"halloween"') !== -1
            : localStorage.getItem('moodshare_server_halloween_available') === 'true';
          if (isHalloweenAvailable && localStorage.getItem('moodshare_halloween') === 'true') {
            root.classList.add('halloween');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
